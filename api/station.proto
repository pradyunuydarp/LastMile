syntax = "proto3";

package station;

option go_package = "lastmile/gen/go/station";

// StationService owns metro station metadata: where each station is and
// which "nearby areas" it serves. It seeds itself from the built-in catalog.
service StationService {
  rpc AddStation(AddStationRequest) returns (AddStationResponse);
  rpc GetStation(GetStationRequest) returns (GetStationResponse);
  rpc ListStations(ListStationsRequest) returns (ListStationsResponse);
}

message Station {
  string id = 1;
  string name = 2;
  repeated string nearby_areas = 3;
  double latitude = 4;
  double longitude = 5;
}

message AddStationRequest {
  Station station = 1;
}

message AddStationResponse {
  string id = 1;
}

message GetStationRequest {
  string id = 1;
}

message GetStationResponse {
  Station station = 1;
}

message ListStationsRequest {}

message ListStationsResponse {
  repeated Station stations = 1;
}
