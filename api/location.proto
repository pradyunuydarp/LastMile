syntax = "proto3";

package location;

option go_package = "lastmile/gen/go/location";

message Location {
    string driver_id = 1;
    double latitude = 2;
    double longitude = 3;
}

message UpdateLocationRequest {
    Location location = 1;
}

// The Location service does proximity detection on every update and reports
// the result for the LAST location in the stream.
message UpdateLocationResponse {
    bool success = 1;
    // Station whose approach zone the driver is currently inside (if any).
    string nearby_station_id = 2;
    double distance_to_station_meters = 3;
    // True only on the update where the driver first ENTERED that zone. This
    // edge is the "driver is a few minutes out, run matching now" trigger.
    bool entered_zone = 4;
}

message GetDriverLocationsRequest {
    repeated string driver_ids = 1;
}

message GetDriverLocationsResponse {
    repeated Location locations = 1;
}

service LocationService {
    rpc UpdateLocation(stream UpdateLocationRequest) returns (UpdateLocationResponse);
    rpc SubscribeLocationUpdates(SubscribeLocationRequest) returns (stream LocationUpdate);
    rpc GetDriverLocations(GetDriverLocationsRequest) returns (GetDriverLocationsResponse);
}

message SubscribeLocationRequest {
    string driver_id = 1;
}

message LocationUpdate {
    string driver_id = 1;
    double latitude = 2;
    double longitude = 3;
}
