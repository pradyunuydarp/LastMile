# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem to keep the noise down; major bumps arrive as separate PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images of the Go Dockerfile and the web Dockerfile.
  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
