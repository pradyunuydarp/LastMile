# React web app (nginx) — proxies /auth, /drivers, /socket.io ... to the gateway.
#   kubectl apply -f k8s/web.yaml
#   minikube service web -n lastmile        # or: kubectl -n lastmile port-forward svc/web 8080:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lastmile
  labels: {app: web, part-of: lastmile}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels: {app: web, part-of: lastmile}
    spec:
      containers:
        - name: web
          image: pradyunuydarp/lastmile-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: lastmile
  labels: {app: web, part-of: lastmile}
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
