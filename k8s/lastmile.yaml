# LastMile on Kubernetes: every microservice + the gateway.
#
#   kubectl apply -f k8s/lastmile.yaml     # services + gateway
#   kubectl apply -f k8s/web.yaml          # React web app
#   kubectl apply -f k8s/loadgen.yaml      # load for the autoscaling demo
#
# Optional: use Supabase instead of the in-memory demo accounts
#   kubectl -n lastmile create secret generic lastmile-supabase \
#     --from-literal=SUPABASE_URL=https://<project>.supabase.co \
#     --from-literal=SUPABASE_KEY=<anon-key>
apiVersion: v1
kind: Namespace
metadata:
  name: lastmile
---
# Station service: Station metadata (seeded with Bengaluru stations).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: station
  namespace: lastmile
  labels: {app: station, part-of: lastmile}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: station
  template:
    metadata:
      labels: {app: station, part-of: lastmile}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: station
          image: pradyunuydarp/lastmile-station:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: STATION_GRPC_ADDR
              value: ":50056"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 50056
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          # Native gRPC probes call grpc.health.v1.Health/Check, which the
          # chassis implements. NOT_SERVING during shutdown = no new traffic.
          readinessProbe:
            grpc: {port: 50056}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            grpc: {port: 50056}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: station
  namespace: lastmile
  labels: {app: station, part-of: lastmile}
spec:
  selector:
    app: station
  ports:
    - name: grpc
      port: 50056
      targetPort: 50056
---
