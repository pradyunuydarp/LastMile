---
# Matching service: STATELESS matching rules. This is the one we scale 1 -> 5.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching
  namespace: lastmile
  labels: {app: matching, part-of: lastmile}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching
  template:
    metadata:
      labels: {app: matching, part-of: lastmile}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: matching
          image: pradyunuydarp/lastmile-matching:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MATCHING_GRPC_ADDR
              value: ":50053"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 50053
          resources:
            requests: {cpu: 100m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          # Native gRPC probes call grpc.health.v1.Health/Check, which the
          # chassis implements. NOT_SERVING during shutdown = no new traffic.
          readinessProbe:
            grpc: {port: 50053}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            grpc: {port: 50053}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: matching
  namespace: lastmile
  labels: {app: matching, part-of: lastmile}
spec:
  # Headless: DNS returns one A record PER POD, so gRPC's round_robin
  # balancer can spread calls across every replica. With a normal ClusterIP
  # all calls ride one HTTP/2 connection to one pod.
  clusterIP: None
  selector:
    app: matching
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
# Autoscale Matching between 1 and 5 replicas on CPU. The behavior block makes
# it react within seconds (scale up) and a minute (scale down) so the demo
# fits in a lecture; production would use slower, steadier settings.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching
  namespace: lastmile
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 20
---
# Gateway: HTTP + socket.io for browsers/phones, gRPC to everything else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lastmile
  labels: {app: gateway, part-of: lastmile}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels: {app: gateway, part-of: lastmile}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: pradyunuydarp/lastmile-gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_GRPC_ADDR
              value: ":50060"
            - name: GATEWAY_HTTP_ADDR
              value: ":8082"
            - name: DRIVER_ADDR
              value: "driver.lastmile.svc.cluster.local:50051"
            - name: USER_ADDR
              value: "user.lastmile.svc.cluster.local:50052"
            - name: MATCHING_ADDR
              value: "dns:///matching.lastmile.svc.cluster.local:50053"
            - name: LOCATION_ADDR
              value: "location.lastmile.svc.cluster.local:50054"
            - name: RIDER_ADDR
              value: "rider.lastmile.svc.cluster.local:50055"
            - name: STATION_ADDR
              value: "station.lastmile.svc.cluster.local:50056"
            - name: TRIP_ADDR
              value: "trip.lastmile.svc.cluster.local:50057"
            - name: NOTIFICATION_ADDR
              value: "notification.lastmile.svc.cluster.local:50058"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8082
            - name: grpc
              containerPort: 50060
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          # /healthz checks only the gateway process itself. If it checked
          # downstream services, one dead service would get the gateway killed too.
          readinessProbe:
            httpGet: {path: /healthz, port: 8082}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8082}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lastmile
  labels: {app: gateway, part-of: lastmile}
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8082
    - name: grpc
      port: 50060
      targetPort: 50060
