# LastMile on Render's FREE plan: the whole backend in one container.
#
# Why a second Blueprint? Render's free instances can SEND private-network
# traffic but can't RECEIVE it, and private services have no free plan
# (https://render.com/docs/free, https://render.com/docs/private-network).
# So eight separately deployed microservices can't talk to each other for
# free. This variant runs all of them, plus the gateway, as child processes
# of cmd/stack in ONE free web service (Dockerfile.stack). The code and the
# gRPC contracts are identical to render.yaml; what you lose is independent
# scaling and failure isolation (one crashed service restarts everything).
#
# Free-plan behaviour to expect:
#   * the service sleeps after 15 minutes without traffic and takes about a
#     minute to wake on the next request;
#   * in-memory state (routes, riders, trips) is lost on every sleep or
#     restart; set PERSISTENCE_DSN to keep the history in Supabase;
#   * 750 free instance hours per workspace per month.
#
# Use this file OR render.yaml in a workspace, not both: they share the
# lastmile-web name. In Render: New -> Blueprint -> pick this repo -> set the
# Blueprint file path to render.free.yaml.

previews:
  generation: "off"

services:
  - type: web
    name: lastmile-stack
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile.stack
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off" # GitHub Actions deploys the tested commit
    envVars:
      - key: PORT # the gateway's public HTTP port
        value: "10000"
      - key: PERSISTENCE_DSN # Supabase pooler URI; empty = no history
        sync: false
      - key: SUPABASE_URL # Supabase Auth; both empty = demo accounts
        sync: false
      - key: SUPABASE_KEY
        sync: false

  - type: web
    name: lastmile-web
    runtime: static
    buildCommand: cd web && npm install --no-audit --no-fund && npm run build
    staticPublishPath: web/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GATEWAY_HOST # web/vite.config.ts -> VITE_GATEWAY_URL=https://<host>
        fromService:
          type: web
          name: lastmile-stack
          envVarKey: RENDER_EXTERNAL_HOSTNAME
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
